<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="oubliette — a Discord-backed encrypted Windows drive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8df0"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g stroke="#1f2540" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- Logo: ring with pulse -->
  <g transform="translate(160 160)">
    <circle r="60" fill="none" stroke="url(#ring)" stroke-width="6" filter="url(#glow)">
      <animate attributeName="r" values="58;64;58" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="5;7;5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#4f8df0" opacity="0.85">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="280" y="160" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="84" font-weight="700" fill="#f1f3fb" letter-spacing="-2">oubliette</text>
  <text x="280" y="208" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="22" fill="#7d88a8">a Discord-backed encrypted Windows drive</text>
  <text x="280" y="248" font-family="'JetBrains Mono','Consolas','Menlo',monospace" font-size="14" fill="#5a6584">chunked · AES-256-GCM · SHA-verified · streaming · mountable</text>

  <!-- Chunks streaming across the top -->
  <g>
    <rect width="14" height="14" rx="2" fill="#4f8df0" opacity="0.85">
      <animate attributeName="x" from="-30" to="1230" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;50;30" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="10" height="10" rx="2" fill="#8b5cf6" opacity="0.7">
      <animate attributeName="x" from="-30" to="1230" dur="7.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="55;30;55" dur="7.5s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect width="12" height="12" rx="2" fill="#f5cf6f" opacity="0.75">
      <animate attributeName="x" from="-30" to="1230" dur="5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="42;62;42" dur="5s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect width="8" height="8" rx="2" fill="#4f8df0" opacity="0.6">
      <animate attributeName="x" from="-30" to="1230" dur="9s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="65;45;65" dur="9s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Chunks streaming across the bottom -->
  <g>
    <rect width="10" height="10" rx="2" fill="#8b5cf6" opacity="0.7">
      <animate attributeName="x" from="1230" to="-30" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="270;290;270" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect width="12" height="12" rx="2" fill="#4f8df0" opacity="0.8">
      <animate attributeName="x" from="1230" to="-30" dur="6.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="295;275;295" dur="6.5s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect width="14" height="14" rx="2" fill="#f5cf6f" opacity="0.7">
      <animate attributeName="x" from="1230" to="-30" dur="9.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="275;295;275" dur="9.5s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
